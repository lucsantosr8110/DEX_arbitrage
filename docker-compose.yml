# ============================================================
# Docker Compose — DEX Arbitrage Bot + Prometheus + Grafana
# ============================================================
# Uso: docker compose up -d
# Requer: .env na raiz com PRIVATE_KEY, BOT_RPC_ENDPOINTS, etc.
# ============================================================

services:
  # ----------------------------------------------------------
  # Flashloan Bot
  # ----------------------------------------------------------
  flashloan-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flashloan-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "9100:9100"   # Prometheus metrics
    volumes:
      - ./logs:/app/logs
    networks:
      - monitoring

  # ----------------------------------------------------------
  # Prometheus
  # ----------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - monitoring
    depends_on:
      - flashloan-bot

  # ----------------------------------------------------------
  # Grafana
  # ----------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
