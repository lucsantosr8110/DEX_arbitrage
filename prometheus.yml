global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "flashloan_bot"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          service: "flashloan_bot"
          instance: "local"

  - job_name: "redis"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:9121"]
        labels:
          service: "redis"
          instance: "local"
