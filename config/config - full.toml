require_price_stability = true
max_volatility_percent = 0.8  # REDUZIDO para 3 hops
prefer_direct_pairs = true
complex_route_penalty = 0.7  # REDUZIDO (menos penalidade para 3 hops)
max_hops_allowed = 3  # DEFINITIVO: 3 HOPS
reject_cyclic_routes = true

# ======================================================================
# ROUTE VALIDATION — Otimizado para 3 hops
# ======================================================================
[arbitrage.route_validation]
enabled = true
max_hops = 3  # DEFINITIVO: 3 HOPS
min_liquidity_per_hop = "75000.0"  # AUMENTADO para 3 hops
reject_high_slippage_routes = true
max_cumulative_slippage = 2.0  # REDUZIDO para 3 hops
require_token_rotation = true
