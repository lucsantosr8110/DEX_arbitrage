# ============================================================
# CONFIGURAÇÃO: DRY RUN (gerado de config.toml)
# NAO EDITAR A MAO — regenerar de config/config.toml
# CONFIGURAÇÃO BASE: STABLE-PROFIT (FINAL v3 - ALL SECTIONS RESTORED)
# Version: v5.5.9-COMPLETE
# Foco: Estrutura 100% validada + Filtros de Liquidez
# ============================================================

[general]
version = "v5.5.9-COMPLETE"
env_source = ".env"
expand_env = true
intermediate_tokens = ["WMATIC", "USDC", "WETH", "DAI", "USDT", "WBTC"]
max_parallel_requests = 50      # 50 para estabilidade de conexão
health_check_interval = 1
shutdown_timeout = 180
enable_frontend = false

# ======================================================================
# FLASHLOAN
# ======================================================================
[flashloan]
enabled = true
executor_address = "0x384b0c63A54F50D754f76A436Ce0302e82FF9068"
wrapper_address = "0xa7bbBa00Ac6776bDF79e55411D28c7Ee09dCA5C1"
aave_pool_address = "0x794a61358D6845594F94dc1DB02A252b5b4814aD"
capital_usd = 100.0
min_profit_usd = 0.0
slippage_tolerance_pct = 0.50
slippage_bps = 15
simulate_before_execute = true
max_premium_bps = 18
fee_pct = 0.0005  # 5 bps - FLASHLOAN_PREMIUM_TOTAL da Aave V3 (verificado on-chain 2026-07-24)
flashloan_decimals = 6

# ======================================================================
# ARBITRAGE — Filtros de Realidade
# ======================================================================
[arbitrage]
enabled = true
executor_address = "0x384b0c63A54F50D754f76A436Ce0302e82FF9068"
advanced_filters_enabled = true
min_profit_threshold_usd = 0.0
min_profit_percent = "0.0"
min_profit_absolute = "0.0"
min_spread_percent = "0.1"
min_liquidity = "50000"         # Gate único de TVL proxy (USD) — ver dex::liquidity
min_volume_24h = "5000.0"
max_slippage = "1.5"
default_trade_amount = "100.0"
max_position_size = "200.0"
max_gas_cost_ratio = "60.0"
simulate_prices = true
execution_mode = "flashloan"
safety_margin = "1.0"
cooldown_seconds = 10  # runtime forca minimo 10s
max_path_length = 3

# ======================================================================
# TRIANGULAR & CROSS-DEX
# ======================================================================
[arbitrage.triangular]
enabled = true
max_hops = 3
min_triangle_profit = "0.0005"
intra_dex_only = false
venues = ["UniswapV3", "QuickSwap", "SushiSwap"]
# Âncoras flashloanáveis / profundas; ciclos start/end em USDC (stable $1).
anchors = ["USDC", "WETH", "WMATIC"]
# Mid-caps curados (sem GHST/CRV/SAND/SUSHI). Gate B2 on-chain no radar.
midcaps = ["LINK", "LDO", "UNI"]

[arbitrage.cross_dex]
enabled = true
min_cross_profit = "0.0004"
max_dex_count = 2

[arbitrage.deduplication]
enabled = true
same_pair_timeout_ms = 3000
similar_profit_threshold = 0.0001
remember_reverted_txs = true
revert_blacklist_duration_ms = 30000

# Executado no gate de liquidez e antes de simular/enviar. Ciclo token é
# obrigatório para flashloan, logo não há flag para desligá-lo.
[arbitrage.route_validation]
enabled = true
max_hops = 3
min_liquidity_per_hop = "50.0"
reject_high_slippage_routes = true
max_cumulative_slippage = 1.2
block_same_dex_consecutive = false

[execution]
enabled = true
skip_permission_check = true
dry_run = true
use_flashloan = true
max_slippage_bps = 50
max_retries = 3
retry_delay_ms = 2000  # runtime forca minimo 2000ms
confirmation_blocks = 1
nonce_monitoring = true
tx_timeout_seconds = 20
auto_replace_tx = false
replace_multiplier = 1.15
replace_max_retries = 2
force_flashloan = true

# --- Custos Realistas ---
default_dex_fee_bps = 30
# NAO entra no net profit: quotes ja sao fee+impact-inclusive (ver core::economics).
# Mantido so para overrides de simulacao legada.
default_price_impact_bps = 25
# Buffer opt-in de drift quote->execucao, em bps do notional. 0 = desligado.
# NAO e price impact. Ligar so se quiser pagar por risco de latencia.
adverse_move_bps = 0
hop_slippage_increase_bps = 5
# 10000 = sem 2o haircut. max_slippage_bps e o unico knob de folga, e ele ja
# e apertado em runtime pelo edge disponivel (economics::max_slippage_bps_for_edge).
# 9800 aplicava -2% multiplicativo POR PERNA, sozinho maior que qualquer edge
# de micro-arbitragem: virava orcamento de sandwich, nao protecao.
safety_margin_bps = 10000
estimate_base_gas_usd = 0.008

[execution.simulation]
enabled = true
max_simulations = 2
simulation_timeout = 8
revert_on_fail = true

[execution.backrun_protection]
enabled = true
max_slippage_increase = 0.50
min_block_confirmations = 1

[execution.cooldown]
enabled = true
global_ms = 1000
pair_ms = 3000
strategy_ms = 2000
revert_penalty_ms = 15000
max_concurrent_executions = 2

[execution.rate_limiting]
enabled = true
max_executions_per_minute = 30
min_interval_between_trades_ms = 1500
burst_size = 5

[execution.dex_fee_bps_map]
QuickSwap = 30
SushiSwap = 30
UniswapV3 = 30
BalancerV2 = 30

[execution.dex_price_impact_bps_map]
QuickSwap = 25
SushiSwap = 25
UniswapV3 = 10
BalancerV2 = 25

# ======================================================================
# LOGGING (ESTRUTURA COMPLETA)
# ======================================================================
[logging]
level = "debug"
format = "compact"
file_enabled = true
file_path = "logs/bot_stable.log"
max_file_size = "50MB"
max_files = 10
compress_logs = true
rust_log = "info,arbitrage=debug,execution=debug"

[logging.levels]
core = "info"
arbitrage = "debug"
execution = "debug"
flashloan = "debug"
network = "warn"
risk = "info"

[log]
show_opportunities = true
show_best_paths = true
show_rejections = true
show_profit_estimates = true
show_gas_details = true
show_dex_responses = false
export_trades_csv = true
export_prices_csv = false
top_spreads_n = 5

# ======================================================================
# NETWORK
# ======================================================================
[network]
name = "polygon"
chain_id = 137
# Segredos vêm do .env via expansão ${VAR} (ver Config::from_file).
# Se ALCHEMY_RPC_URL/ALCHEMY_WS_URL não estiverem definidos, o literal "${...}"
# permanece e o fallback público abaixo assume. Nunca versione chaves aqui.
rpc_url = "${QUICKNODE_RPC_URL}"
rpc_endpoints = [
    "${QUICKNODE_RPC_URL}",
    "${ALCHEMY_RPC_URL}",
    "${INFURA_RPC_URL}",
    "https://polygon-bor-rpc.publicnode.com",
    "https://1rpc.io/matic",
    "https://polygon-rpc.com",
    "https://polygon.llamarpc.com",
]
ws_endpoints = [
    # Público primeiro: WS privado cai → radar morre → TUI congela. Sem auth
    # mantém radar vivo mesmo se chaves pagas falharem.
    "wss://polygon-bor-rpc.publicnode.com",
    "${QUICKNODE_WS_URL}",
    "${ALCHEMY_WS_URL}",
    "${INFURA_WS_URL}",
    "wss://polygon.drpc.org",
    "wss://polygon-rpc.com",
    "wss://polygon.llamarpc.com",
]
timeout_ms = 5000
max_reorg_depth = 64
block_delay_max = 2
chain_monitoring = true

# ======================================================================
# WALLET
# ======================================================================
[wallet]
private_key = "${PRIVATE_KEY}"
address = "0x152Aa7ecC490860115C4d1369a19C970f9e9eFFf"
min_balance_eth = "0.5"
max_gas_price_gwei = 500
auto_sweep = false
sweep_threshold = "0.1"
max_tx_value = "0.0"

[wallet.multisig]
enabled = false
address = "0x0000000000000000000000000000000000000000"
threshold = 2

# ======================================================================
# WRAPPER & MEV
# ======================================================================
[wrapper]
# DESABILITADO por design: flashloan direto é mais simples e um hop a menos.
# Wrapper novo (0xa7bb…a5C1) deployado + linkage validado (setWrapper +
# authorizeWrapper no executor 0x9AA1…A32f). Para reativar: enabled = true.
enabled = false
address = "0xa7bbBa00Ac6776bDF79e55411D28c7Ee09dCA5C1"
owner_address = "0x152Aa7ecC490860115C4d1369a19C970f9e9eFFf"
executor_allowed = true
auto_authorize_executor = true
authorization_check_enabled = true
contract_type = "FlashloanCaller"

[mev]
enabled = false
signer_address = "0x152Aa7ecC490860115C4d1369a19C970f9e9eFFf"
min_tip_matic = "0.00"
target_block_offset = 0
timeout_seconds = 8

# ======================================================================
# EXECUTOR / GAS (CORRIGIDO: "stations" restaurado)
# ======================================================================
[executor]
address = "0x6c4EC038B9fD25288c4C024DDd39aD05bFd19804"
validate_signature_hash = true
max_flashloan_premium = 2
contract_type = "StandardExecutor"
timeout_seconds = 10
use_direct_calls = true
skip_wrapper_validation = true

[gas]
mode = "balanced"
use_polygon_oracle = true
max_gwei = 500
priority_gwei = 60.0
default_gas_price_gwei = 50.0
default_gas_limit = 300000
# Consumo ESPERADO da rota (flashloan Aave + 3 swaps), usado para precificar custo.
# Teto da tx continua em default_gas_limit/max_gas_limit.
estimated_gas_units = 400000
max_gas_limit = 700000
fallback_strategy = "conservative"
prediction_window = 2
gas_buffer_percent = 110
gas_cost_limit_usd = 0.50
eip1559_enabled = true
max_fee_multiplier = 1.5

# SEÇÃO RESTAURADA - OBRIGATÓRIA PARA O RUST
[gas.stations]
etherchain = false
blocknative = false
pokt = false
polygon_oracle_url = "https://gasstation.polygon.technology/v2"

[gas.optimization]
auto_adjust = true
min_gas_savings = 0.001
max_gas_price_impact = 5.0

# ======================================================================
